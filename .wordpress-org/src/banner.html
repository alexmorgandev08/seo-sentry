<style>
  @font-face{font-family:Outfit;src:url('file:///home/mazed78/www/wordpress/wp-content/plugins/seo-change-monitor/frontend/public/fonts/outfit-latin.woff2') format('woff2');font-weight:100 900;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  .b{
    width:100%;height:100%;position:relative;overflow:hidden;
    background:#566afa;
    display:flex;align-items:center;gap:32px;padding:0 40px;
    font-family:Outfit,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  /* ---- left: identity, headline, feature grid ---- */
  .left{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .logo-row{display:flex;align-items:center;gap:10px}
  .logo-row svg{width:26px;height:26px;flex:0 0 auto}
  .logo-row .name{color:#fff;font-weight:600;font-size:19px;letter-spacing:-.3px}
  .headline{color:#fff;font-weight:600;font-size:28px;line-height:1.18;letter-spacing:-.6px}
  .grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;row-gap:11px}
  .feature{display:flex;align-items:center;gap:9px}
  .feature .ic{
    width:26px;height:26px;border-radius:50%;flex:0 0 auto;
    background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;
  }
  .feature .ic svg{width:14px;height:14px}
  .feature span{color:rgba(255,255,255,.94);font-weight:500;font-size:13.5px;white-space:nowrap}

  /* ---- right: product mockup ---- */
  .right{flex:0 0 300px;position:relative;height:184px}
  .frame{
    position:absolute;inset:0;border-radius:10px;overflow:hidden;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.20);
  }
  .frame .bar{height:22px;display:flex;align-items:center;gap:5px;padding:0 9px;background:rgba(255,255,255,.08)}
  .frame .bar i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35)}
  .frame .body{padding:16px}
  .skel{height:8px;border-radius:4px;background:rgba(255,255,255,.18)}
  .skel + .skel{margin-top:9px}
  .w-full{width:100%}
  .w-3\/4{width:75%}
  .w-1\/2{width:45%}

  .card{
    position:absolute;display:flex;align-items:center;gap:9px;
    background:#fff;border-radius:9px;padding:9px 13px;
    box-shadow:0 10px 24px rgba(10,20,60,.28);
  }
  .card .ic{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .card .lbl{font-size:12.5px;font-weight:600;color:#1a2340;white-space:nowrap}
  .card-ok{left:-18px;bottom:-16px}
  .card-ok .ic{background:rgba(22,163,74,.14)}
  .card-alert{right:-14px;top:-14px}
  .card-alert .ic{background:rgba(239,68,68,.14)}
</style>
<div class="b">
  <div class="left">
    <div class="logo-row">
      <svg viewBox="0 0 96 96" fill="none">
        <path d="M48 5 L85 18 V47 C85 68 68 84 48 92 C28 84 11 68 11 47 V18 Z M27 48 Q48 31 69 48 Q48 65 27 48 Z"
              fill="#fff" fill-rule="evenodd"/>
        <circle cx="48" cy="48" r="7.5" fill="#fbbf24"/>
      </svg>
      <span class="name">SEO Sentry</span>
    </div>

    <div class="headline">Know Instantly When<br>Your SEO Breaks</div>

    <div class="grid">
      <div class="feature">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M8 12h8M8 16h8"/>
          </svg>
        </span>
        <span>Monitored Pages</span>
      </div>
      <div class="feature">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/>
          </svg>
        </span>
        <span>Change History</span>
      </div>
      <div class="feature">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
          </svg>
        </span>
        <span>Site Checks</span>
      </div>
      <div class="feature">
        <span class="ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a5 5 0 00-5 5v3c0 1-.5 2-1.5 3h13c-1-1-1.5-2-1.5-3V8a5 5 0 00-5-5z"/><path d="M9.5 19a2.5 2.5 0 005 0"/>
          </svg>
        </span>
        <span>Instant Alerts</span>
      </div>
    </div>
  </div>

  <div class="right">
    <div class="frame">
      <div class="bar"><i></i><i></i><i></i></div>
      <div class="body">
        <div class="skel w-3/4"></div>
        <div class="skel w-full"></div>
        <div class="skel w-1/2"></div>
        <div class="skel w-full"></div>
        <div class="skel w-3/4"></div>
      </div>
    </div>
    <div class="card card-ok">
      <span class="ic">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12l5 5L20 6"/>
        </svg>
      </span>
      <span class="lbl">4 Pages Monitored</span>
    </div>
    <div class="card card-alert">
      <span class="ic">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2.7 18a2 2 0 001.8 3h15a2 2 0 001.8-3L13.7 3.9a2 2 0 00-3.4 0z"/>
        </svg>
      </span>
      <span class="lbl">2 Critical Changes</span>
    </div>
  </div>
</div>
